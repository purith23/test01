<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pink Dream Test Site</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb);
        min-height: 100vh;
        overflow-x: hidden;
        color: #fff;
      }

      /* floating glow circles */
      .circle {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.6;
        animation: float 6s infinite ease-in-out;
      }

      .c1 {
        width: 200px;
        height: 200px;
        background: #ff4fd8;
        top: 10%;
        left: 10%;
      }

      .c2 {
        width: 250px;
        height: 250px;
        background: #ffb3ec;
        bottom: 10%;
        right: 10%;
        animation-delay: 2s;
      }

      .c3 {
        width: 180px;
        height: 180px;
        background: #ff66c4;
        top: 50%;
        left: 70%;
        animation-delay: 4s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      /* glass container */
      .container {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 80px 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        padding: 40px;
        max-width: 400px;
        margin: auto;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      }

      p {
        margin-bottom: 20px;
        opacity: 0.9;
      }

      .btn {
        display: inline-block;
        padding: 12px 25px;
        background: #ff4fd8;
        color: white;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(255, 79, 216, 0.4);
      }

      .btn:hover {
        transform: scale(1.1);
        background: #ff2ec4;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 15px;
        margin-top: 40px;
      }

      .mini {
        background: rgba(255, 255, 255, 0.25);
        padding: 20px;
        border-radius: 15px;
        transition: 0.3s;
      }

      .mini:hover {
        transform: translateY(-8px);
        background: rgba(255, 255, 255, 0.35);
      }

      footer {
        margin-top: 60px;
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>

  <body>
    <!-- glowing background shapes -->
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>

    <div class="container">
      <div class="card">
        <h1>Pink Dream ✨</h1>
        <p>A cute colorful test website with soft glow vibes.</p>
        <a href="#" class="btn">Get Started</a>
      </div>

      <div class="grid">
        <div class="mini">💖 Cute Design</div>
        <div class="mini">🌸 Soft Colors</div>
        <div class="mini">✨ Smooth UI</div>
        <div class="mini">🎀 Unique Style</div>
      </div>

      <footer>© 2026 Pink Dream Test Site</footer>
    </div>
  </body>
</html>
